[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.1.0"
description = "One speech-to-text interface for files and live audio: Soniox or AssemblyAI behind one command and one Python API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.optional-dependencies]
live = ["websockets>=16"]

[project.scripts]
stt = "stt.cli:main"

[tool.setuptools.packages.find]
include = ["stt", "stt.*"]
